name: Better Jukebox
version: 2.1.2.29
description : |
  BetterJukebox v2.1.2.29 - Mod Load Main Menu Watcher Test

  - Uses Melody Mania PlaylistManager.FavoritesPlaylist as the single Favorites backend
  - BetterJukebox Favorites UI, stars, Queue All and Shuffle now read/write native Favorites
  - Detects legacy BetterJukebox Favorites.json and offers a one-time import
  - Merges legacy favorites with existing Melody Mania favorites without duplicates
  - Deletes the old favorites file automatically after a complete verified migration
  - If migration is incomplete, shows a dialog to Keep File or Delete Old File
  - Keeps playlist filters, blacklist, queue, playback and Sing behavior unchanged
  - Builds on v2.1.2.18 Native Settings Compile Fix Test

authors:
  - Jimmy Berglund

requiredTypes:
  - System.Reflection.MethodInfo
  - System.Reflection.BindingFlags
  - System.Reflection.PropertyInfo
  - System.Reflection.FieldInfo
  - System.Reflection.ParameterInfo
  - System.Security.Cryptography.MD5
  - System.Text.Encoding
